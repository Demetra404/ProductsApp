[project]
name = "productscategory"
version = "0.1.0"
description = ""
authors = [
    {name = "demetra",email = "jennyani98@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest (>=8.4.1,<9.0.0)",
    "mypy (>=1.17.1,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.2.1"

